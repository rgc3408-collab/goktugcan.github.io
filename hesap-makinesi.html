<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hesap Makinesi | Göktuğ</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #070b09;

            font-family: Arial, sans-serif;

            color: white;
        }

        .calculator {
            width: 340px;

            padding: 25px;

            background: #0d130f;

            border: 1px solid #1d2a22;

            border-radius: 20px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .title {
            text-align: center;

            margin-bottom: 20px;

            color: #39ff88;

            font-size: 20px;

            font-weight: bold;
        }

        #display {
            width: 100%;

            height: 70px;

            margin-bottom: 18px;

            padding: 15px;

            background: #070b09;

            border: 1px solid #1d2a22;

            border-radius: 10px;

            color: white;

            text-align: right;

            font-size: 30px;
        }

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            border: 1px solid #26362c;

            border-radius: 10px;

            background: #151e18;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            border-color: #39ff88;
            color: #39ff88;
        }

        .operator {
            color: #39ff88;
        }

        .clear {
            color: #ff6b6b;
        }

        .equals {
            background: #39ff88;

            color: #061009;

            border-color: #39ff88;
        }

        .equals:hover {
            color: #061009;

            box-shadow: 0 8px 25px rgba(57, 255, 136, 0.2);
        }

        .back {
            margin-top: 20px;

            display: block;

            text-align: center;

            color: #7f8b84;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #39ff88;
        }

    </style>
</head>


<body>

    <div class="calculator">

        <div class="title">
            Göktuğ — Hesap Makinesi
        </div>


        <input
            type="text"
            id="display"
            value="0"
            readonly
        >


        <div class="buttons">

            <button class="clear" onclick="temizle()">
                C
            </button>

            <button onclick="sil()">
                ⌫
            </button>

            <button class="operator" onclick="sayiEkle('%')">
                %
            </button>

            <button class="operator" onclick="sayiEkle('/')">
                ÷
            </button>


            <button onclick="sayiEkle('7')">
                7
            </button>

            <button onclick="sayiEkle('8')">
                8
            </button>

            <button onclick="sayiEkle('9')">
                9
            </button>

            <button class="operator" onclick="sayiEkle('*')">
                ×
            </button>


            <button onclick="sayiEkle('4')">
                4
            </button>

            <button onclick="sayiEkle('5')">
                5
            </button>

            <button onclick="sayiEkle('6')">
                6
            </button>

            <button class="operator" onclick="sayiEkle('-')">
                −
            </button>


            <button onclick="sayiEkle('1')">
                1
            </button>

            <button onclick="sayiEkle('2')">
                2
            </button>

            <button onclick="sayiEkle('3')">
                3
            </button>

            <button class="operator" onclick="sayiEkle('+')">
                +
            </button>


            <button onclick="sayiEkle('0')">
                0
            </button>

            <button onclick="sayiEkle('.')">
                .
            </button>

            <button class="equals" onclick="hesapla()">
                =
            </button>

        </div>


        <a href="index.html" class="back">
            ← Portföye Dön
        </a>

    </div>


    <script>

        const display =
            document.getElementById("display");


        function sayiEkle(deger) {

            if (display.value === "0") {

                display.value = deger;

            } else {

                display.value += deger;

            }

        }


        function temizle() {

            display.value = "0";

        }


        function sil() {

            if (display.value.length > 1) {

                display.value =
                    display.value.slice(0, -1);

            } else {

                display.value = "0";

            }

        }


        function hesapla() {

            try {

                display.value =
                    Function(
                        "return " + display.value
                    )();

            } catch {

                display.value = "Hata";

            }

        }

    </script>

</body>

</html>
